version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Next.js 16 is a framework migration, done on purpose, not by a bot.
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      # eslint-config-next must match the Next.js major (15), so it moves with Next.
      - dependency-name: "eslint-config-next"
        update-types: ["version-update:semver-major"]
      # The ESLint plugins that eslint-config-next bundles do not support ESLint 10 yet.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # typescript-eslint does not support TypeScript 7 yet.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
