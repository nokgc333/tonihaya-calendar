name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (type-check / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run check:duplicates
      - run: npm run type-check
      - run: npm run test:coverage
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 7
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: out
          path: out/
          retention-days: 1

  e2e:
    name: e2e (playwright / axe)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - name: Install the browser and its system packages
        timeout-minutes: 20
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  audit:
    name: audit (production dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: npm audit --omit=dev --audit-level=high

  dependency-review:
    name: dependency review (added dependencies)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base=${{ github.event.pull_request.base.sha }}
          head=${{ github.event.pull_request.head.sha }}
          if gh api "repos/${{ github.repository }}/dependency-graph/compare/${base}...${head}" > /dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The dependency graph is off, so the added dependencies were not reviewed. Turn it on in Settings > Advanced Security."
          fi
      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high

  lighthouse:
    name: lighthouse (size budget / perf score)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v8
        with:
          name: out
          path: out/
      - run: npm run ci:lhci
