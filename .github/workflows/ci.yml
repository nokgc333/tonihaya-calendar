name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (type-check / test / build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # macOS で生成した package-lock.json は Linux 固有の optional ネイティブ依存
      # (@emnapi/* や *-linux-x64-gnu 等) を記録できず、厳格な `npm ci` が Linux で
      # 「lock 不整合」で落ちる。`npm install` はそのランナーの OS に合わせて optional を
      # 解決し自己修復するため、クロスプラットフォームな optional 依存に強い。
      - run: npm install --no-audit --no-fund
      - run: npm run type-check
      - run: npm run test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: out
          path: out/
          retention-days: 1

  lighthouse:
    name: lighthouse (size budget / perf score)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      # macOS で生成した package-lock.json は Linux 固有の optional ネイティブ依存
      # (@emnapi/* や *-linux-x64-gnu 等) を記録できず、厳格な `npm ci` が Linux で
      # 「lock 不整合」で落ちる。`npm install` はそのランナーの OS に合わせて optional を
      # 解決し自己修復するため、クロスプラットフォームな optional 依存に強い。
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: out
          path: out/
      - run: npm run ci:lhci
